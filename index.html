<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Zombie Escape GPS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }
    
    /* SCHERMATA MENU (PRIORITÀ ASSOLUTA Z-INDEX 99999) */
    #setup-menu {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #0d0d0d;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
    }

    .title { color: #00FF66; font-size: 28px; font-weight: 900; text-align: center; margin-bottom: 4px; }
    .subtitle { color: #888; font-size: 13px; text-align: center; margin-bottom: 24px; }
    
    .section-label { font-size: 12px; color: #aaa; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }

    .opt-grid { display: flex; gap: 8px; margin-bottom: 20px; }
    .opt-btn {
      flex: 1;
      padding: 12px 8px;
      background: #1a1a1a;
      border: 2px solid #333;
      color: #888;
      border-radius: 10px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    .opt-btn.active { border-color: #00FF66; background: rgba(0, 255, 102, 0.15); color: #00FF66; }

    .start-btn {
      background: #00FF66;
      color: #000;
      font-weight: 900;
      font-size: 18px;
      padding: 18px;
      border: none;
      border-radius: 12px;
      width: 100%;
      margin-top: auto;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
    }

    /* MAPPA E HUD */
    #map { width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; background: #111; }
    
    .hud { position: absolute; top:0; left:0; z-index: 100; pointer-events: none; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
    .hud-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
    .stats-box { background: rgba(0, 0, 0, 0.9); padding: 8px 14px; border-radius: 10px; border: 1px solid #00FF66; }
    .lives { color: #ff4757; font-size: 20px; letter-spacing: 2px; font-weight: bold; }
    .hud-center { text-align: center; background: rgba(0,0,0,0.9); padding: 6px 14px; border-radius: 10px; border: 1px solid #333; }

    .hud-bottom { display: flex; justify-content: space-between; width: 100%; pointer-events: auto; }
    .metric-card { background: rgba(15, 23, 42, 0.95); border: 1px solid #333; padding: 8px 12px; border-radius: 10px; min-width: 90px; text-align: center; }
    .metric-value { font-size: 18px; font-weight: bold; color: #00FF66; }
    .metric-label { font-size: 10px; color: #aaa; text-transform: uppercase; }

    .dev-controls { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 110; display: grid; grid-template-columns: repeat(3, 44px); gap: 4px; background: rgba(0,0,0,0.9); padding: 6px; border-radius: 10px; pointer-events: auto; }
    .dev-btn { background: #222; color: #00FF66; border: 1px solid #00FF66; width: 44px; height: 44px; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; }

    /* ICONE MARKER */
    .player-icon { width: 18px; height: 18px; background: #00FF66; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 12px #00FF66; }
    .z-walker { width: 16px; height: 16px; background: #ff4757; border: 2px solid #000; border-radius: 50%; }
    .z-runner { width: 14px; height: 14px; background: #ffa502; border: 2px solid #000; border-radius: 50%; }
    .z-tank { width: 22px; height: 22px; background: #a55eea; border: 2px solid #000; border-radius: 50%; }
    .crate-icon { width: 16px; height: 16px; background: #ffd32a; border: 2px solid #000; border-radius: 3px; }
  </style>
</head>
<body>

  <!-- MENU DI CONFIGURAZIONE -->
  <div id="setup-menu">
    <div class="title">ZOMBIE ESCAPE</div>
    <div class="subtitle">Imposta la tua partita survival</div>

    <div class="section-label">1. Difficoltà</div>
    <div class="opt-grid">
      <div class="opt-btn active" onclick="selectOpt(this, 'diff', 'easy')">FACILE</div>
      <div class="opt-btn" onclick="selectOpt(this, 'diff', 'medium')">MEDIA</div>
      <div class="opt-btn" onclick="selectOpt(this, 'diff', 'hard')">HARDCORE</div>
    </div>

    <div class="section-label">2. Vite Iniziali</div>
    <div class="opt-grid">
      <div class="opt-btn" onclick="selectOpt(this, 'lives', 1)">1 VITA</div>
      <div class="opt-btn active" onclick="selectOpt(this, 'lives', 3)">3 VITE</div>
      <div class="opt-btn" onclick="selectOpt(this, 'lives', 5)">5 VITE</div>
    </div>

    <div class="section-label">3. Quantità Zombie Iniziali</div>
    <div class="opt-grid">
      <div class="opt-btn" onclick="selectOpt(this, 'count', 2)">POCHI (2)</div>
      <div class="opt-btn active" onclick="selectOpt(this, 'count', 4)">NORMAL (4)</div>
      <div class="opt-btn" onclick="selectOpt(this, 'count', 8)">ORDA (8)</div>
    </div>

    <button class="start-btn" onclick="launchGame()">AVVIA PARTITA</button>
  </div>

  <!-- INTERFACCIA GIOCO (HUD) -->
  <div class="hud">
    <div class="hud-top">
      <div class="stats-box">
        <div id="lives-display" class="lives">♥♥♥</div>
        <div id="wave-txt" style="font-size:10px; color:#aaa;">ONDATA 1</div>
      </div>
      
      <div class="hud-center">
        <div id="timer" style="color:#00FF66; font-weight:bold; font-size:16px;">00:00</div>
        <div id="score" style="font-size:10px; color:#aaa;">PUNTI: 0</div>
      </div>
    </div>

    <div class="dev-controls" id="dev-panel">
      <div></div><button class="dev-btn" onclick="moveSim(0.00015, 0)">▲</button><div></div>
      <button class="dev-btn" onclick="moveSim(0, -0.00015)">◄</button>
      <button class="dev-btn" onclick="moveSim(-0.00015, 0)">▼</button>
      <button class="dev-btn" onclick="moveSim(0, 0.00015)">►</button>
    </div>

    <div class="hud-bottom">
      <div class="metric-card">
        <div id="threat-dist" class="metric-value" style="color:#ff4757;">--</div>
        <div class="metric-label">Minaccia</div>
      </div>
      <div class="metric-card">
        <div id="horde-size" class="metric-value" style="color:#00E5FF;">0</div>
        <div class="metric-label">Zombie</div>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, playerMarker;
    let playerPos = [45.4642, 9.1900];
    let zombies = [], crates = [];
    let lives = 3, maxLives = 3, score = 0, timeSurvived = 0, wave = 1;
    let gameInterval, waveInterval, crateInterval;
    let isGameOver = false;

    // Impostazioni scelte dal menu
    let config = { diff: 'easy', lives: 3, count: 4 };

    const diffSpeeds = { easy: 0.6, medium: 1.0, hard: 1.5 };

    function selectOpt(btn, category, value) {
      config[category] = value;
      btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function initMap() {
      map = L.map('map', { zoomControl: false, attributionControl: false }).setView(playerPos, 17);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

      const playerIcon = L.divIcon({ className: 'player-icon', html: '', iconSize: [18, 18] });
      playerMarker = L.marker(playerPos, { icon: playerIcon }).addTo(map);
    }

    function spawnZombie(type) {
      let radius = 0.002;
      let zPos = [playerPos[0] + (Math.random() - 0.5) * radius, playerPos[1] + (Math.random() - 0.5) * radius];

      let cssClass = 'z-walker', speed = 0.025, dmg = 1;
      if(type === 'runner') { cssClass = 'z-runner'; speed = 0.045; }
      if(type === 'tank') { cssClass = 'z-tank'; speed = 0.012; dmg = 2; }

      const zIcon = L.divIcon({ className: cssClass, html: '', iconSize: [16, 16] });
      let marker = L.marker(zPos, { icon: zIcon }).addTo(map);

      zombies.push({ marker: marker, pos: zPos, speed: speed * diffSpeeds[config.diff], damage: dmg });
      document.getElementById('horde-size').innerText = zombies.length;
    }

    function spawnCrate() {
      let cPos = [playerPos[0] + (Math.random() - 0.5) * 0.002, playerPos[1] + (Math.random() - 0.5) * 0.002];
      const cIcon = L.divIcon({ className: 'crate-icon', html: '', iconSize: [16, 16] });
      let marker = L.marker(cPos, { icon: cIcon }).addTo(map);
      crates.push({ marker: marker, pos: cPos });
    }

    function updateGame() {
      if (isGameOver) return;

      timeSurvived++;
      let min = String(Math.floor(timeSurvived / 60)).padStart(2, '0');
      let sec = String(timeSurvived % 60).padStart(2, '0');
      document.getElementById('timer').innerText = `${min}:${sec}`;
      
      score += wave * 5;
      document.getElementById('score').innerText = `PUNTI: ${score}`;

      let closestDist = 9999;

      zombies.forEach((z) => {
        let dLat = playerPos[0] - z.pos[0];
        let dLng = playerPos[1] - z.pos[1];
        
        z.pos[0] += dLat * z.speed;
        z.pos[1] += dLng * z.speed;
        z.marker.setLatLng(z.pos);

        let dist = Math.hypot(dLat, dLng) * 111320;
        if (dist < closestDist) closestDist = dist;

        if (dist < 10) {
          lives -= z.damage;
          updateLivesUI();
          z.pos = [playerPos[0] + (Math.random() - 0.5) * 0.003, playerPos[1] + (Math.random() - 0.5) * 0.003];
        }
      });

      crates.forEach((c, index) => {
        let dist = Math.hypot(playerPos[0] - c.pos[0], playerPos[1] - c.pos[1]) * 111320;
        if (dist < 12) {
          map.removeLayer(c.marker);
          crates.splice(index, 1);
          if (lives < maxLives) lives++;
          score += 200;
          updateLivesUI();
        }
      });

      document.getElementById('threat-dist').innerText = closestDist < 1000 ? Math.round(closestDist) + 'm' : '--';
    }

    function updateLivesUI() {
      let hearts = '';
      for (let i = 0; i < lives; i++) hearts += '♥';
      document.getElementById('lives-display').innerText = hearts || 'DEAD';
      if (lives <= 0) {
        isGameOver = true;
        clearInterval(gameInterval);
        clearInterval(waveInterval);
        alert(`GAME OVER!\nPunteggio Finale: ${score}`);
        location.reload();
      }
    }

    function launchGame() {
      lives = config.lives;
      maxLives = config.lives;
      updateLivesUI();

      // Nascondi menu
      document.getElementById('setup-menu').style.display = 'none';

      // Ricalcola la mappa
      setTimeout(() => { map.invalidateSize(); }, 100);

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (pos) => {
            if(isGameOver) return;
            playerPos = [pos.coords.latitude, pos.coords.longitude];
            playerMarker.setLatLng(playerPos);
            map.panTo(playerPos);
            document.getElementById('dev-panel').style.display = 'none';
          },
          (err) => console.log("Simulatore GPS attivo"),
          { enableHighAccuracy: true }
        );
      }

      // Spawna zombie scelti dal menu
      for(let i = 0; i < config.count; i++) spawnZombie('walker');
      spawnCrate();

      gameInterval = setInterval(updateGame, 1000);
      waveInterval = setInterval(() => {
        wave++;
        document.getElementById('wave-txt').innerText = `ONDATA ${wave}`;
        spawnZombie('walker');
        if(wave % 2 === 0) spawnZombie('runner');
      }, 25000);
      crateInterval = setInterval(spawnCrate, 30000);
    }

    function moveSim(lat, lng) {
      if(isGameOver) return;
      playerPos[0] += lat;
      playerPos[1] += lng;
      playerMarker.setLatLng(playerPos);
      map.panTo(playerPos);
    }

    window.onload = initMap;
  </script>
</body>
</html>
