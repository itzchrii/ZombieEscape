name: Build iOS IPA (Cordova, unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install npm dependencies (se presenti)
        run: |
          if [ -f package.json ]; then npm install; fi

      - name: Add iOS platform
        run: cordova platform add ios

      - name: Prepare iOS project
        run: cordova prepare ios

      # Se il progetto usa plugin che richiedono CocoaPods
      - name: Install CocoaPods dependencies (se presente Podfile)
        run: |
          if [ -f platforms/ios/Podfile ]; then
            cd platforms/ios
            pod install
          fi

      - name: Locate Xcode project/workspace
        id: locate
        run: |
          cd platforms/ios
          if ls *.xcworkspace >/dev/null 2>&1; then
            WORKSPACE=$(ls -d *.xcworkspace | head -n1)
            echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          fi
          PROJECT=$(ls -d *.xcodeproj | head -n1)
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned .app with xcodebuild
        run: |
          cd platforms/ios
          if [ -n "${{ steps.locate.outputs.workspace }}" ]; then
            xcodebuild -workspace "${{ steps.locate.outputs.workspace }}" \
              -scheme "${{ steps.locate.outputs.scheme }}" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE="" \
              clean build
          else
            xcodebuild -project "${{ steps.locate.outputs.project }}" \
              -scheme "${{ steps.locate.outputs.scheme }}" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE="" \
              clean build
          fi

      - name: Package unsigned .ipa
        run: |
          cd platforms/ios
          APP_PATH=$(find build/Build/Products -name "*.app" -maxdepth 2 | head -n1)
          echo "App trovata in: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r ZombieEscape-unsigned.ipa Payload
          mkdir -p ../../output
          cp ZombieEscape-unsigned.ipa ../../output/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZombieEscape-unsigned-ipa
          path: output/ZombieEscape-unsigned.ipa
          retention-days: 14
